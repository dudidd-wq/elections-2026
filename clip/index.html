<head>

<title>ראשי הרשימות בפודקאסטים ובראיונות ארוכים – קליפ סיכום | השוואת מצעים 2026</title>
<meta name="description" content="קליפ מונפש (HTML) המסכם את 47 ההופעות של ראשי 13 הרשימות בפודקאסטים ובראיונות ארוכים, 21.9–21.10.2026. ניטרלי, לפי סדר האלף-בית, ציטוטים מאומתים בלבד.">

<body>
<div id="app" class="app" tabindex="-1">
  <div id="viewport" class="viewport">
    <div id="stage" class="stage" role="region" aria-roledescription="קליפ" aria-label="קליפ סיכום: ראשי הרשימות בפודקאסטים ובראיונות ארוכים">
      <canvas id="aurora" class="aurora" width="192" height="108" aria-hidden="true"></canvas>

      <canvas id="parts" class="parts" width="960" height="540" aria-hidden="true"></canvas>
      <i class="vign" aria-hidden="true"></i>
      <canvas id="wave" class="wave" width="1920" height="240" aria-hidden="true"></canvas>
      <header class="chrome" aria-hidden="true">
        <span class="brand"><span class="live"><i id="liveDot"></i>סיכום</span><svg viewBox="0 0 24 24" class="mic"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6"/></svg>השוואת מצעים · פודקאסטים וראיונות</span>
        <span id="chap" class="chap"></span>
      </header>
      <div id="scenes"></div>
      <i id="leak" class="leak" aria-hidden="true"></i>
      <i id="flash" class="flash" aria-hidden="true"></i>
      <i class="scan" aria-hidden="true"></i>
      <div class="tline" aria-hidden="true"><i id="tline"></i></div>
    </div>
  </div>
  <div id="sound" class="sound" hidden>
    <div class="sbox">
      <button id="sBtn" class="sbtn" type="button"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg><span>הפעל עם סאונד</span></button>
      <p class="ssub">מוזיקה מסונתזת בדפדפן · אפשר לכבות בכל רגע (M)</p>
      <button id="sSkip" class="sskip" type="button">צפייה בלי סאונד</button>
    </div>
  </div>
  <div id="controls" class="controls" dir="rtl">
    <button id="bPlay" class="cb" type="button" aria-label="השהיה" title="השהיה (רווח)"><svg viewBox="0 0 24 24"><path id="icPlay" d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
    <span id="time" class="time" dir="ltr" aria-hidden="true">0:00 / 0:00</span>
    <div id="scrub" class="scrub" dir="ltr" role="slider" tabindex="0" aria-label="מיקום בקליפ" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0" aria-valuetext="0:00">
      <div class="track"><i id="fill" class="fill"></i><span id="ticks" class="ticks"></span><i id="knob" class="knob"></i></div>
    </div>
    <button id="bMusic" class="cb" type="button" aria-pressed="false" aria-label="מוזיקה (כבויה)" title="מוזיקה (M)"><svg viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.6"/><circle cx="16.5" cy="16" r="2.6"/><path id="icMute" d="M3 3l18 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg></button>

    <a class="cb back" href="../#/podcasts" title="לחלק הפודקאסטים באתר">לאתר</a>
  </div>
  <p id="rot" class="rot" aria-hidden="true">לצפייה נוחה יותר – סובבו את המכשיר לרוחב</p>
  <p id="live" class="sr" aria-live="polite"></p>
</div>
